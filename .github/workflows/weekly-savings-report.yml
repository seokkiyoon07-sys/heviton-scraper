name: Weekly Savings Report

on:
  schedule:
    # 매주 일요일 19:00 KST = 10:00 UTC
    - cron: "0 10 * * 0"
  workflow_dispatch:

concurrency:
  group: weekly-savings-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send weekly savings report
        env:
          HEVITON_USER_ID: ${{ secrets.HEVITON_USER_ID }}
          HEVITON_PASSWORD: ${{ secrets.HEVITON_PASSWORD }}
          HEVITON_BASE_URL: ${{ secrets.HEVITON_BASE_URL }}
          HEVITON_API_BASE: ${{ vars.HEVITON_API_BASE }}
          JANDI_WEBHOOK_URL: ${{ secrets.JANDI_WEBHOOK_URL }}
          TOU_SAVINGS_ENABLED: ${{ vars.TOU_SAVINGS_ENABLED }}
          TOU_TARIFF_NAME: ${{ vars.TOU_TARIFF_NAME }}
          TOU_CONTRACT_POWER_KW: ${{ vars.TOU_CONTRACT_POWER_KW }}
          TOU_BASIC_CHARGE_PER_KW: ${{ vars.TOU_BASIC_CHARGE_PER_KW }}
          TOU_RATES_JSON: ${{ vars.TOU_RATES_JSON }}
          TOU_RATIOS_JSON: ${{ vars.TOU_RATIOS_JSON }}
        run: python main.py --report-period weekly

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-savings-logs
          path: logs/
          retention-days: 7
